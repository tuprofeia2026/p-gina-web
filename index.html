<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tu Profe IA — Aprendé tecnología a tu ritmo</title>
<script src="https://unpkg.com/lucide@1.28.0"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
<style>
  :root{
    --paper:#F5F0E7; --surface:#FFFDF9; --ink:#332F28; --sub:#6E685C;
    --sage:#6F8A74; --sageDeep:#526B59; --sageTint:#E7EDE3;
    --honey:#C08A3F; --honeyDeep:#9C6E2E; --honeyTint:#F2E7D2;
    --border:#E7DECE; --borderSoft:#EFE8DB; --headerBg:rgba(245,240,231,.85);
    --shadow:0 14px 30px rgba(90,68,38,.10);
    --shadowSm:0 6px 16px rgba(90,68,38,.07);
    --serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; font-family:var(--sans); color:var(--ink); min-height:100vh;
    background:
      radial-gradient(1100px 520px at 6% -10%, var(--honeyTint) 0%, transparent 55%),
      radial-gradient(950px 480px at 100% 2%, var(--sageTint) 0%, transparent 52%),
      radial-gradient(820px 520px at 50% 118%, var(--honeyTint) 0%, transparent 58%),
      var(--paper);
    background-attachment:fixed;
  }
  /* textura de papel muy sutil */
  .grain{position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.045;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
  header,main,footer{position:relative; z-index:1}
  .wrap{max-width:1120px; margin:0 auto; padding:0 24px}
  .narrow{max-width:920px; margin:0 auto; padding:0 24px}
  h1,h2,h3{font-family:var(--serif); font-weight:600; margin:0; letter-spacing:-.01em}
  button{font-family:var(--sans)}
  .eyebrow{font-size:13px; letter-spacing:1.6px; text-transform:uppercase; color:var(--honeyDeep); font-weight:700}
  .eyebrow.sage{color:var(--sageDeep)}
  .lead{font-size:18px; line-height:1.62; color:var(--sub)}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px; box-shadow:var(--shadowSm)}
  .icon{width:1em;height:1em;stroke-width:2}
  .chip{display:inline-flex; align-items:center; gap:6px; background:var(--sageTint); color:var(--sageDeep);
    border:1px solid var(--border); border-radius:999px; padding:6px 13px; font-size:13px; font-weight:600}
  .chip.honey{background:var(--honeyTint); color:var(--honeyDeep)}
  .chip .icon{width:14px;height:14px}
  .btn{border-radius:12px; padding:13px 24px; font-size:15px; font-weight:600; cursor:pointer;
    transition:background .18s ease, transform .05s, box-shadow .18s; display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid transparent}
  .btn:active{transform:translateY(1px)}
  .btn .icon{width:18px;height:18px}
  .btn-primary{background:var(--sage); color:#fff; border-color:var(--sage); box-shadow:0 8px 18px rgba(82,107,89,.25)}
  .btn-primary:hover{background:var(--sageDeep)}
  .btn-honey{background:var(--honey); color:#fff; border-color:var(--honey); box-shadow:0 8px 18px rgba(156,110,46,.22)}
  .btn-honey:hover{background:var(--honeyDeep)}
  .btn-quiet{background:var(--surface); color:var(--sageDeep); border-color:var(--border)}
  .btn-quiet:hover{background:var(--paper)}
  .btn[disabled]{opacity:.5; cursor:not-allowed; box-shadow:none}
  .btn-full{width:100%}
  header{position:sticky; top:0; z-index:40; background:var(--headerBg); backdrop-filter:blur(10px); border-bottom:1px solid var(--borderSoft)}
  .hbar{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:15px 24px; max-width:1120px; margin:0 auto}
  .brand{background:none; border:none; cursor:pointer; display:flex; align-items:center; gap:10px}
  .logo{width:36px;height:36px;border-radius:11px;background:var(--sage);display:grid;place-items:center;box-shadow:0 4px 10px rgba(82,107,89,.3)}
  .logo .icon{width:19px;height:19px;color:#fff}
  .brand-name{font-family:var(--serif); font-size:21px; color:var(--ink); font-weight:600}
  .brand-name span{color:var(--honey)}
  nav{display:flex; align-items:center; gap:4px; flex-wrap:wrap}
  .navlink{background:none;border:none;cursor:pointer;font-size:14.5px;color:var(--sub);padding:8px 13px;border-radius:9px;font-weight:500}
  .navlink:hover{background:var(--borderSoft)}
  .navlink.active{background:var(--honeyTint); color:var(--honeyDeep); font-weight:700}
  /* hero */
  .hero-grid{display:grid; grid-template-columns:1.05fr .95fr; gap:52px; align-items:center; padding:76px 0 20px}
  .hero-solo{max-width:680px; padding:84px 0 24px}
  .hero-solo .eyebrow{display:block; margin-bottom:6px}
  .hero-solo h1{font-size:54px; line-height:1.07; color:var(--ink); margin-top:18px}
  .hero-solo h1 .accent{color:var(--sage); font-style:italic}
  .hero-solo p{font-size:19px; line-height:1.6; color:var(--sub); margin:22px 0 30px; max-width:520px}
  .chiprow{display:flex; gap:8px; flex-wrap:wrap; margin-top:30px}
  /* marco de foto */
  .photo{position:relative; border-radius:22px; overflow:hidden; border:1px solid var(--border);
    background:linear-gradient(135deg,var(--honeyTint),var(--sageTint)); box-shadow:var(--shadow)}
  .photo img{display:block; width:100%; height:100%; object-fit:cover}
  .photo .ph{aspect-ratio:4/3; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--honeyDeep); text-align:center; padding:24px}
  .photo .ph .icon{width:44px;height:44px;opacity:.6}
  .photo .ph small{font-size:13px; color:var(--sub); max-width:220px; line-height:1.5}
  .hero-photo{transform:rotate(1.4deg)}
  .hero-photo::after{content:""; position:absolute; inset:0; border-radius:22px; border:6px solid var(--surface); pointer-events:none}
  /* banda cálida */
  .band{background:var(--honeyTint); border:1px solid var(--border); border-radius:20px; padding:26px 30px; margin-top:40px; box-shadow:var(--shadowSm)}
  .band h3{font-size:16px;color:var(--honeyDeep);margin-bottom:18px}
  .band-row{display:grid; grid-template-columns:repeat(3,1fr); gap:22px}
  .band-item{display:flex; align-items:center; gap:12px}
  .band-ic{width:40px;height:40px;border-radius:11px;background:var(--surface);display:grid;place-items:center;flex-shrink:0;box-shadow:var(--shadowSm)}
  .band-ic .icon{width:19px;height:19px;color:var(--honey)}
  .band-item span{font-size:14.5px;color:var(--ink)}
  /* cursos */
  .sec-head{margin-bottom:30px}
  .sec-head h2{font-size:36px;color:var(--ink);margin-top:10px}
  .grid-courses{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:22px}
  .ccard{position:relative;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;
    transition:transform .18s ease, box-shadow .18s ease; display:flex; flex-direction:column; gap:14px; min-height:230px; box-shadow:var(--shadowSm)}
  .ccard:hover{transform:translateY(-4px); box-shadow:var(--shadow)}
  .ccard.featured{border-color:var(--honey); box-shadow:0 10px 26px rgba(156,110,46,.14)}
  .ccard.soon{opacity:.9}
  .tag.muted{background:var(--sub)}
  /* Consultoría / empresas */
  .svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
  .svc{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:var(--shadowSm);transition:transform .18s,box-shadow .18s}
  .svc:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .svc-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .svc-ic{width:44px;height:44px;border-radius:12px;background:var(--sageTint);display:grid;place-items:center;flex-shrink:0}
  .svc-ic .icon{width:22px;height:22px;color:var(--sageDeep)}
  .svc-head h3{font-family:var(--serif);font-size:20px;color:var(--ink);margin:0;line-height:1.15}
  .svc-lead{font-size:14.5px;color:var(--sub);margin:0 0 14px;line-height:1.5}
  .svc-list{list-style:none;padding:0;margin:0;display:grid;gap:9px}
  .svc-list li{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;line-height:1.5;color:var(--ink)}
  .svc-list .icon{width:16px;height:16px;color:var(--sage);flex-shrink:0;margin-top:3px}
  .cta-emp{background:var(--honeyTint);border:1px solid var(--border);border-radius:18px;padding:28px 30px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
  /* Textos: títulos centrados, párrafos justificados y parejos */
  .hero-solo{text-align:center}
  .hero-solo p{text-align:justify;text-justify:inter-word;max-width:560px;margin-left:auto;margin-right:auto}
  .hero-solo>div{justify-content:center}
  .chiprow{justify-content:center}
  .sec-head{text-align:center}
  .ccard{text-align:left}
  .pathcard{text-align:left}
  .svc{text-align:left}
  .svc-list{text-align:left}
  .narrow>h1{text-align:center}
  .narrow>.eyebrow{text-align:center;display:block}
  .narrow .lead{text-align:justify;text-justify:inter-word;margin-left:auto;margin-right:auto}
  .lead{text-align:justify;text-justify:inter-word}
  .cta-emp{justify-content:space-between}
  .just{text-align:justify;text-justify:inter-word}
  /* Certificado */
  .cert{background:#fff;border-radius:10px;padding:12px;box-shadow:var(--shadow)}
  .cert-inner{border:3px double #23306a;border-radius:6px;padding:46px 42px;text-align:center;font-family:var(--serif)}
  .cert-eyebrow{font-family:var(--sans);letter-spacing:2px;font-size:12px;font-weight:700;color:#23306a;margin-bottom:14px}
  .cert-title{font-size:38px;line-height:1.08;color:#1b2452;margin:0 0 10px;text-transform:uppercase;letter-spacing:.5px}
  .cert-sub{font-family:var(--sans);font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#6a6e80;margin-bottom:18px}
  .cert-name{font-size:31px;color:#1b2452;font-weight:700;border-bottom:1px solid #d8dbe8;display:inline-block;padding:0 24px 8px;margin-bottom:20px}
  .cert-body{font-family:var(--sans);font-size:14.5px;line-height:1.7;color:#3a3f52;max-width:560px;margin:0 auto 22px}
  .cert-date{margin-bottom:26px}
  .cert-date-lab{font-family:var(--sans);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#6a6e80}
  .cert-date-val{font-size:16px;color:#1b2452;font-weight:700;font-family:var(--sans)}
  .cert-sign{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;max-width:520px;margin:0 auto}
  .cert-sign-col{flex:1}
  .cert-sign-line{border-top:1px solid #23306a;margin-bottom:6px}
  .cert-sign-name{font-family:var(--sans);font-size:14px;font-weight:700;color:#1b2452}
  .cert-sign-role{font-family:var(--sans);font-size:12px;color:#6a6e80}
  .cert-seal{width:44px;height:44px;border-radius:50%;background:#23306a;display:grid;place-items:center;flex-shrink:0}
  .cert-seal .icon{color:#fff;width:20px;height:20px}
  @media print{
    header,#nav,footer,.no-print,.grain{display:none !important}
    body{background:#fff !important}
    .wrap{padding:0 !important;max-width:none !important}
    .cert{box-shadow:none;padding:0}
  }
  .ccard-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .price{font-family:var(--serif); font-size:23px; color:var(--ink); font-weight:600}
  .ccard h3{font-size:22px; line-height:1.2; color:var(--ink)}
  .ccard p{font-size:14.5px; line-height:1.55; color:var(--sub); margin:0; flex-grow:1}
  .ccard .more{display:flex; align-items:center; gap:6px; color:var(--sage); font-size:14.5px; font-weight:600}
  .more .icon{width:16px;height:16px}
  .tag{position:absolute; top:-11px; left:20px; background:var(--honey); color:#fff; font-size:11.5px; font-weight:700;
    letter-spacing:.4px; text-transform:uppercase; padding:5px 11px; border-radius:999px; box-shadow:0 4px 10px rgba(156,110,46,.3)}
  /* detalle */
  .back{background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--sub);font-size:14.5px;margin-bottom:24px;font-weight:500}
  .back .icon{width:17px;height:17px}
  .detail-grid{display:grid; grid-template-columns:1.6fr 1fr; gap:44px; align-items:start}
  .facts{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:40px}
  .fact{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:15px 12px; text-align:center; box-shadow:var(--shadowSm)}
  .fact .icon{width:19px;height:19px;color:var(--honey);margin:0 auto 7px;display:block}
  .fact .fl{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--sub);margin-bottom:3px}
  .fact .fv{font-size:14.5px;color:var(--ink);font-weight:600}
  .sec{margin-bottom:34px}
  .sec h2{font-size:23px; color:var(--ink); margin-bottom:14px}
  .bullets{list-style:none;padding:0;margin:0;display:grid;gap:11px}
  .bullets li{display:flex;gap:11px;align-items:flex-start;font-size:15.5px;line-height:1.55;color:var(--ink)}
  .bullets .ck{width:22px;height:22px;border-radius:7px;background:var(--sageTint);display:grid;place-items:center;flex-shrink:0;margin-top:1px}
  .bullets .ck .icon{width:14px;height:14px;color:var(--sageDeep)}
  .mod{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadowSm)}
  .modn{width:28px;height:28px;border-radius:8px;background:var(--honeyTint);color:var(--honeyDeep);display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0}
  .buy{position:sticky; top:88px}
  .buy .lbl{font-size:13px;color:var(--sub);margin-bottom:4px}
  .buy .big{font-family:var(--serif);font-size:40px;color:var(--ink);font-weight:600;margin-bottom:18px}
  .buy .feat{margin-top:18px;display:grid;gap:11px}
  .buy .feat div{display:flex;gap:9px;align-items:center;font-size:14px;color:var(--sub)}
  .buy .feat .icon{width:16px;height:16px;color:var(--honey)}
  .instructor{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadowSm)}
  .instructor .av{width:52px;height:52px;border-radius:14px;background:var(--honeyTint);display:grid;place-items:center;flex-shrink:0}
  .instructor .av .icon{width:24px;height:24px;color:var(--honey)}
  /* inscripción */
  .insc-grid{display:grid; grid-template-columns:1.55fr 1fr; gap:32px; align-items:start}
  .fcard-head{display:flex;align-items:center;gap:11px;margin-bottom:16px}
  .fcard-ic{width:36px;height:36px;border-radius:11px;background:var(--honeyTint);display:grid;place-items:center}
  .fcard-ic .icon{width:18px;height:18px;color:var(--honey)}
  .fcard-head h2{font-size:20px;color:var(--ink)}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .field{display:block;margin-bottom:4px}
  .field .lab{font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--sub);display:block;margin-bottom:6px;font-weight:700}
  .field .box{display:flex;align-items:center;gap:9px;border:1px solid var(--border);border-radius:11px;padding:0 13px;background:var(--paper);transition:border-color .15s}
  .field .box:focus-within{border-color:var(--sage)}
  .field .box .icon{width:16px;height:16px;color:var(--honey);flex-shrink:0}
  .field input{border:none;outline:none;background:transparent;padding:12px 0;font-size:15px;width:100%;font-family:var(--sans);color:var(--ink)}
  .field .help{font-size:12.5px;color:var(--sub);display:block;margin-top:5px;line-height:1.45}
  textarea{width:100%;border:1px solid var(--border);border-radius:11px;padding:12px 13px;font-size:15px;font-family:var(--sans);color:var(--ink);background:var(--paper);outline:none;resize:vertical}
  textarea:focus{border-color:var(--sage)}
  .sit{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .sitchip{cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--sub);border-radius:999px;padding:9px 15px;font-size:13.5px;font-family:var(--sans);display:inline-flex;align-items:center;gap:6px;font-weight:500}
  .sitchip .icon{width:14px;height:14px;display:none}
  .sitchip.on{border-color:var(--sage);background:var(--sageTint);color:var(--sageDeep);font-weight:700}
  .sitchip.on .icon{display:inline-block}
  .summary{position:sticky; top:88px}
  .sum-eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:14px;color:var(--honeyDeep);font-size:11.5px;letter-spacing:1px;text-transform:uppercase;font-weight:700}
  .sum-eyebrow .icon{width:16px;height:16px}
  .sum-inc{display:grid;gap:9px;margin-bottom:18px}
  .sum-inc div{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--ink)}
  .sum-inc .icon{width:15px;height:15px;color:var(--sage);margin-top:2px;flex-shrink:0}
  .sum-total{border-top:1px solid var(--border);padding-top:16px;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px}
  .fineprint{font-size:12.5px;color:var(--sub);text-align:center;margin-top:14px;line-height:1.5}
  /* páginas simples */
  .two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .muted-note{font-size:13.5px;color:var(--sub);margin-top:24px;font-style:italic}
  .bio-photo{width:88px;height:88px;border-radius:18px;overflow:hidden;flex-shrink:0;border:1px solid var(--border);
    background:linear-gradient(135deg,var(--honeyTint),var(--sageTint));display:grid;place-items:center;font-family:var(--serif);font-size:26px;color:var(--honeyDeep);font-weight:600}
  .bio-photo img{width:100%;height:100%;object-fit:cover}
  /* pago */
  .payrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
  .payrow .k{font-size:13.5px;color:var(--sub)}
  .payrow .v{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);font-weight:600;text-align:right}
  .copy{background:none;border:none;cursor:pointer;color:var(--sage);display:inline-flex}
  .copy .icon{width:16px;height:16px}
  footer{border-top:1px solid var(--borderSoft); background:var(--surface); margin-top:48px}
  .fbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;padding:36px 24px;max-width:1120px;margin:0 auto}
  .lesson{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px 16px;cursor:pointer;font-family:var(--sans);box-shadow:var(--shadowSm)}
  .lesson:hover:not(.locked){border-color:var(--honey)}
  .lesson.locked{opacity:.55;cursor:not-allowed}
  .lesson .l-ic .icon{width:22px;height:22px}
  .lesson .l-txt{font-size:15px;color:var(--ink);flex-grow:1}
  .lesson .l-txt strong{font-weight:700}
  .lesson .l-meta{font-size:12.5px;color:var(--sub);white-space:nowrap}
  .player{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadowSm)}
  .ytwrap{position:relative;padding-top:56.25%;border-radius:13px;overflow:hidden;background:#000}
  .ytwrap iframe,.ytwrap #ytplayer{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
  .player .screen{aspect-ratio:16/9;background:#2A2824;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#EDE7DA;text-align:center;padding:20px}
  .player .screen small{font-size:13px;opacity:.85;line-height:1.5}
  .player .screen .icon{color:#EDE7DA}
  .pbar{position:relative;height:10px;background:var(--borderSoft);border-radius:999px;margin:16px 0 12px;cursor:pointer;overflow:hidden}
  .pmax{position:absolute;top:0;left:0;height:100%;background:var(--honeyTint)}
  .pfill{position:absolute;top:0;left:0;height:100%;background:var(--sage);z-index:1}
  .pctrl{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

function toggleSit(s){ state.sit = state.sit.includes(s) ? state.sit.filter(x=>x!==s) : [...state.sit,s]; render(); }
async function confirmInscription(){
  const g=id=>((document.getElementById(id)||{}).value||"").trim();
  const nombre=g("f_nombre"), apellido=g("f_apellido"), email=g("f_email"), ciudad=g("f_ciudad");
  const emailOk=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email);
  if(!nombre||!apellido||!emailOk||!ciudad||state.sit.length===0){
    alert("Completá los campos obligatorios (*) con un email válido y elegí al menos una situación."); return;
  }
  const c=courseById(state.courseId);
  const data={
    nombre, apellido, email, ciudad,
    telefono: g("f_tel"),
    situacion: state.sit.join(", "),
    carrera: g("f_carrera"),
    universidad: g("f_uni"),
    sugeridos: g("f_sug").slice(0,1000),
    motivacion: g("f_mot").slice(0,1000),
    curso: c.title,
    creado: firebase.firestore.FieldValue.serverTimestamp()
  };
  const btn=document.getElementById("insc_btn");
  if(btn){ btn.disabled=true; btn.innerHTML="Enviando…"; }
  try{
    await db.collection("inscripciones").add(data);
    document.getElementById("app").innerHTML=doneHTML(c,nombre,email);
    lucide.createIcons(); window.scrollTo({top:0});
  }catch(e){
    if(btn){ btn.disabled=false; btn.innerHTML='Confirmar inscripción'; }
    lucide.createIcons();
    alert("No pudimos registrar tu inscripción. Revisá tu conexión e intentá de nuevo.");
    console.error("Error al guardar inscripción:", e);
  }
}

/* ═══════════════ AULA — vistas y lógica (Firebase) ═══════════════ */
let fotoTmp="";
function reducirFoto(file,cb){
  const r=new FileReader();
  r.onload=()=>{ const img=new Image(); img.onload=()=>{ const S=256,cv=document.createElement("canvas"); cv.width=S; cv.height=S;
    const ctx=cv.getContext("2d"); const s=Math.min(img.width,img.height);
    ctx.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,S,S); cb(cv.toDataURL("image/jpeg",0.8)); };
    img.src=r.result; };
  r.readAsDataURL(file);
}
function avatar(p,size){
  const s=size||64; const init=(((p&&p.nombre)||(sesion&&sesion.nombre)||"?")+"").charAt(0).toUpperCase();
  return (p&&p.foto)
    ? `<span class="pavatar" style="width:${s}px;height:${s}px"><img src="${p.foto}" alt=""></span>`
    : `<span class="pavatar" style="width:${s}px;height:${s}px;font-size:${Math.round(s*0.38)}px">${init}</span>`;
}

function login(){
  const e=val("lg_email").trim().toLowerCase(), p=val("lg_pass");
  const err=document.getElementById("lg_err"); if(err) err.textContent="";
  const btn=document.getElementById("lg_btn"); if(btn){ btn.disabled=true; btn.innerHTML="Entrando…"; }
  auth.signInWithEmailAndPassword(e,p).catch(()=>{
    if(btn){ btn.disabled=false; btn.innerHTML='Entrar'; lucide.createIcons(); }
    const el=document.getElementById("lg_err"); if(el) el.textContent="Email o contraseña incorrectos.";
  });

/* ── Reproductor de YouTube ── */
let curLec=null, ytPlayer=null, ytTimer=null, ytMax=0, ytApiLoading=false;
function lessonById(cid,lid){ return (LESSONS[cid]||[]).find(x=>x.id===lid); }
function openLeccion(cid,lid){ curLec={cid,lid}; const st=lecState(cid,lid); ytMax=st.watched||0; state.view="leccion"; render(); }
function leccionHTML(){

  return `<section class="wrap" style="padding:32px 24px 84px;max-width:820px">

    <div style="font-size:13px;color:var(--sub);margin-bottom:4px">${esc(c.title)}</div>
    <h1 style="font-size:28px;color:var(--ink);margin-bottom:18px">${esc(L.titulo)}</h1>
    <div class="player">
      <div class="ytwrap"><div id="ytplayer"></div></div>
      <div class="pbar"><div class="pfill" id="pl_fill" style="width:${st.done?100:0}%"></div></div>
      <div class="pctrl">
        <span id="pl_done">${st.done?'<span class="chip"><i data-lucide="check" class="icon"></i>Completada</span>':''}</span>
        ${L.pdf?`<a class="btn btn-quiet" href="${L.pdf}" target="_blank" rel="noopener" style="margin-left:auto;text-decoration:none"><i data-lucide="file-text" class="icon"></i> Material (PDF)</a>`:''}
      </div>
    </div>
    <p class="fineprint" style="text-align:left;margin-top:14px">La clase se marca como completa cuando mirás el ${Math.round(UMBRAL_COMPLETADO*100)}%.</p>
  </section>`;
}
function ensureYTApi(cb){
  if(window.YT && window.YT.Player){ cb(); return; }
  const prev=window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady=function(){ if(prev) prev(); cb(); };
  if(!ytApiLoading){ ytApiLoading=true; const t=document.createElement("script"); t.src="https://www.youtube.com/iframe_api"; document.head.appendChild(t); }
}
function initYT(){
  const L=lessonById(curLec.cid,curLec.lid); if(!L) return;
  ensureYTApi(()=>{
    if(ytPlayer&&ytPlayer.destroy){ try{ytPlayer.destroy();}catch(e){} ytPlayer=null; }
    if(!document.getElementById("ytplayer")) return;
    ytPlayer=new YT.Player("ytplayer",{ videoId:L.yt, playerVars:{ rel:0, modestbranding:1, playsinline:1 },
      events:{ onReady:()=>{ if(ytTimer) clearInterval(ytTimer); ytTimer=setInterval(ytTick,1000); } } });
  });
}
function ytTick(){
  if(!ytPlayer||!ytPlayer.getCurrentTime||!curLec) return;
  const t=ytPlayer.getCurrentTime()||0, d=(ytPlayer.getDuration&&ytPlayer.getDuration())||0;
  if(d<=0) return;
  if(t>ytMax) ytMax=t;
  const wasDone=lecState(curLec.cid,curLec.lid).done;
  const done = wasDone || (ytMax >= d*UMBRAL_COMPLETADO);
  progreso[curLec.cid]=progreso[curLec.cid]||{};
  const prevW=(progreso[curLec.cid][curLec.lid]||{}).watched||0;
  progreso[curLec.cid][curLec.lid]={ watched:Math.max(prevW,ytMax), done };
  const fill=document.getElementById("pl_fill");
  if(fill) fill.style.width=(done?100:Math.min(100,ytMax/d*100)).toFixed(1)+"%";
  if(done && !wasDone){ saveProg(); const dn=document.getElementById("pl_done"); if(dn){ dn.innerHTML='<span class="chip"><i data-lucide="check" class="icon"></i>Completada</span>'; lucide.createIcons(); } }
}
function closeLeccion(){ if(ytTimer){ clearInterval(ytTimer); ytTimer=null; } if(ytPlayer&&ytPlayer.destroy){ try{ytPlayer.destroy();}catch(e){} ytPlayer=null; } saveProg(); curLec=null; state.view="aula"; render(); }

/* ── Evaluación (20 preguntas, 3 intentos, revisión de respuestas) ── */
function intentosCurso(cid){ return (progreso[cid]||{}).intentos||0; }
function openEval(cid){
  const Q=QUIZ[cid]; const max=(Q&&Q.maxIntentos)||3;
  if(Q && !(progreso[cid]||{}).aprobado && intentosCurso(cid)>=max){ alert("Ya usaste tus "+max+" intentos. Escribinos para reactivar el examen."); return; }
  evalState={ cid, result:null, review:false }; state.view="evaluacion"; render();
}
function evalHTML(){
  const Q=QUIZ[evalState.cid]; const c=courseById(evalState.cid); const max=(Q&&Q.maxIntentos)||3;
  if(!Q) return `<section class="narrow" style="padding:64px 24px"><button class="back" onclick="state.view='aula';render()"><i data-lucide="arrow-left" class="icon"></i> Volver</button><p>La evaluación de este curso estará disponible pronto.</p></section>`;

  if(evalState.result){
    const r=evalState.result; const pass=r.score>=Q.aprobar; const intentos=intentosCurso(evalState.cid); const quedan=Math.max(0,max-intentos);
    const review = evalState.review ? `<div style="text-align:left;margin-top:24px">${Q.preguntas.map((p,qi)=>`<div class="card" style="margin-bottom:12px">
        <div style="font-weight:700;color:var(--ink);margin-bottom:10px">${qi+1}. ${esc(p.q)}</div>
        <div style="display:grid;gap:6px">${p.ops.map((o,oi)=>{ const esOk=oi===p.ok; const esMia=oi===r.answers[qi];
          const col=esOk?"var(--sageDeep)":(esMia&&!esOk?"#B4462F":"var(--sub)"); const ic=esOk?"check":(esMia&&!esOk?"x":"minus");
          return `<div style="display:flex;gap:8px;align-items:center;font-size:14.5px;color:${col}"><i data-lucide="${ic}" class="icon" style="width:16px;height:16px;flex-shrink:0"></i><span${esOk?' style="font-weight:600"':''}>${esc(o)}${esOk?" · correcta":(esMia?" · tu respuesta":"")}</span></div>`;
        }).join("")}</div></div>`).join("")}</div>` : "";
    return `<section class="narrow" style="padding:56px 24px 90px;max-width:600px;text-align:center">
      <span style="width:66px;height:66px;border-radius:20px;background:${pass?"var(--sageTint)":"var(--honeyTint)"};display:grid;place-items:center;margin:0 auto 20px"><i data-lucide="${pass?"award":"rotate-ccw"}" class="icon" style="width:32px;height:32px;color:${pass?"var(--sageDeep)":"var(--honeyDeep)"}"></i></span>
      <h1 style="font-size:32px;color:var(--ink);margin-bottom:10px">${pass?"¡Aprobaste!":"No alcanzó esta vez"}</h1>
      <p class="lead" style="margin:0 auto 6px;max-width:440px">Obtuviste <strong style="color:var(--ink)">${r.score} de ${Q.preguntas.length}</strong> ${pass?"correctas.":("(necesitás "+Q.aprobar+").")}</p>
      <p style="font-size:13.5px;color:var(--sub);margin:0 0 22px">Intento ${intentos} de ${max}${!pass&&quedan>0?" · te quedan "+quedan:""}.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        <button class="btn btn-quiet" onclick="evalState.review=!evalState.review;render()"><i data-lucide="list-checks" class="icon"></i> ${evalState.review?"Ocultar":"Ver"} respuestas correctas</button>
        ${pass
          ? `<button class="btn btn-honey" onclick="openCert('${evalState.cid}')"><i data-lucide="award" class="icon"></i> Solicitar certificado</button>`
          : (quedan>0
              ? `<button class="btn btn-primary" onclick="openEval('${evalState.cid}')"><i data-lucide="rotate-ccw" class="icon"></i> Reintentar</button>`
              : `<span style="font-size:14px;color:var(--sub);align-self:center">Sin intentos disponibles.</span>`)}
      </div>
      ${review}
      <div style="margin-top:22px"><button class="btn btn-quiet" onclick="state.view='aula';render()">Volver al aula</button></div>
    </section>`;
  }

  const intento=intentosCurso(evalState.cid)+1;
  return `<section class="narrow" style="padding:40px 24px 90px;max-width:640px">
    <button class="back" onclick="state.view='aula';render()"><i data-lucide="arrow-left" class="icon"></i> Volver al aula</button>
    <span class="eyebrow">Evaluación final · Intento ${intento} de ${max}</span>
    <h1 style="font-size:30px;color:var(--ink);margin:12px 0 6px">${esc(c.title)}</h1>
    <p class="lead" style="font-size:15.5px;margin:0 0 24px">Respondé las ${Q.preguntas.length} preguntas. Necesitás ${Q.aprobar} correctas para aprobar. Tenés hasta ${max} intentos.</p>
    ${Q.preguntas.map((p,qi)=>`<div class="card" style="margin-bottom:14px"><div style="font-weight:700;color:var(--ink);margin-bottom:12px">${qi+1}. ${esc(p.q)}</div>
      <div style="display:grid;gap:8px">${p.ops.map((o,oi)=>`<label style="display:flex;gap:10px;align-items:center;cursor:pointer;font-size:15px;color:var(--ink)"><input type="radio" name="q${qi}" value="${oi}"> ${esc(o)}</label>`).join("")}</div></div>`).join("")}
    <button class="btn btn-honey btn-full" onclick="submitEval()">Enviar respuestas</button>
  </section>`;
}
function submitEval(){
  const Q=QUIZ[evalState.cid]; const answers=[]; let score=0, faltan=false;
  Q.preguntas.forEach((p,qi)=>{ const s=document.querySelector('input[name="q'+qi+'"]:checked'); if(!s){ faltan=true; answers[qi]=-1; } else { answers[qi]=+s.value; if(+s.value===p.ok) score++; } });
  if(faltan){ alert("Respondé todas las preguntas antes de enviar."); return; }
  progreso[evalState.cid]=progreso[evalState.cid]||{};
  progreso[evalState.cid].intentos=(progreso[evalState.cid].intentos||0)+1;
  if(score>=Q.aprobar) progreso[evalState.cid].aprobado=true;
  saveProg();
  evalState.result={ score, answers }; evalState.review=false;
  render();
}

async function habilitarAlumno(){
  const nombre=val("ad_nombre").trim(), email=val("ad_user").trim().toLowerCase(), pass=val("ad_pass").trim(), curso=val("ad_curso");
  const err=document.getElementById("ad_err"); if(err) err.textContent="";
  if(!email){ if(err) err.textContent="Ingresá el email del alumno."; return; }
  const btn=document.getElementById("ad_btn"); if(btn){ btn.disabled=true; btn.innerHTML="Procesando…"; }
  const ref=db.collection("alumnos").doc(email);
  try{
    const snap=await ref.get();
    if(snap.exists){
      const d=snap.data(); const cursos=Array.from(new Set([...(d.cursos||[]),curso]));
      await ref.set({ cursos }, {merge:true});
    } else {
      if(!nombre||pass.length<6){ if(err) err.textContent="Para un alumno nuevo, poné nombre y una contraseña de 6 caracteres o más."; if(btn){ btn.disabled=false; btn.innerHTML='Habilitar acceso'; lucide.createIcons(); } return; }
      try{ await adminAuth().createUserWithEmailAndPassword(email,pass); await adminAuth().signOut(); }
      catch(e){ if(e.code!=="auth/email-already-in-use") throw e; }
      await ref.set({ email, nombre, cursos:[curso], creado: firebase.firestore.FieldValue.serverTimestamp() });
    }
    await loadAlumnos();
  }catch(e){
    if(btn){ btn.disabled=false; btn.innerHTML='Habilitar acceso'; lucide.createIcons(); }
    if(err) err.textContent = (e.code==="auth/weak-password"?"La contraseña debe tener 6+ caracteres.":e.code==="auth/invalid-email"?"El email no es válido.":"No se pudo habilitar. Revisá los datos.");
    console.error(e);
  }
}

  url=(url||"").trim(); if(!url) return "";

  if(/^[A-Za-z0-9_-]{11}$/.test(url)) return url;

    <label class="field" style="margin-bottom:20px"><span class="lab">Curso</span><select onchange="selectClaseCurso(this.value)" style="${S}">${opts}</select></label>
    ${lex.length?rows:`<div class="card" style="color:var(--sub);margin-bottom:12px">Este curso todavía no tiene clases. Agregá la primera.</div>`}
    <button class="btn btn-quiet" onclick="addClase()" style="margin-bottom:20px"><i data-lucide="plus" class="icon"></i> Agregar clase</button>
    <div id="cl_err" style="color:#B4462F;font-size:13px;min-height:18px"></div>
    <button id="cl_btn" class="btn btn-honey" onclick="guardarClases()"><i data-lucide="check" class="icon"></i> Guardar clases</button>
    <p class="fineprint" style="text-align:left;margin-top:12px">Pegá el link de YouTube completo (yo extraigo el ID solo). Para el PDF, subilo a Drive como «cualquiera con el enlace» y pegá el link.</p>
  </section>`;
}
function guardarClases(){
  syncLec();
  const out={}; let error="";
  Object.keys(EDIT_ALL).forEach(cid=>{
    const arr=[];
    (EDIT_ALL[cid]||[]).forEach(l=>{
      const tit=(l.titulo||"").trim(), raw=(l.yt||"").trim(), pdf=(l.pdf||"").trim();
      if(!tit && !raw && !pdf) return;              // fila vacía → se ignora
      if(!tit){ error=error||("En «"+(courseById(cid)?courseById(cid).title:cid)+"» hay una clase sin título."); return; }
      const yt=ytId(raw);
      if(!yt){ error=error||("La clase «"+tit+"» no tiene un link de YouTube válido."); return; }
      arr.push({ id:l.id||("l"+Math.random().toString(36).slice(2,8)), titulo:tit, yt:yt, pdf:pdf });
    });
    out[cid]=arr;
  });
  const el=document.getElementById("cl_err");
  if(error){ if(el) el.textContent=error; return; }
  const btn=document.getElementById("cl_btn"); if(btn){ btn.disabled=true; btn.innerHTML="Guardando…"; }
  db.collection("config").doc("textos").set({lessons:out},{merge:true})
    .then(()=>{ LESSONS=out; state.view="admin"; loadAlumnos(); })
    .catch(e=>{ if(btn){ btn.disabled=false; btn.innerHTML='Guardar clases'; lucide.createIcons(); } if(el) el.textContent="No se pudo guardar. Revisá tu conexión."; console.error(e); });
}


/* ── Gestor de cursos (agregar / borrar / editar) ── */
let EDIT_CURSOS = [];
function openCursos(){ EDIT_CURSOS=courses.map(c=>Object.assign({}, c, {learn:(c.learn||[]).slice(),prerequisites:(c.prerequisites||[]).slice(),includes:(c.includes||[]).slice(),syllabus:(c.syllabus||[]).slice()})); state.view="cursosadmin"; render(); }
function syncCursos(){
  const gv=id=>{ const e=document.getElementById(id); return e?e.value:undefined; };
  const arr=id=>{ const e=document.getElementById(id); return e? e.value.split("\n").map(s=>s.trim()).filter(Boolean):undefined; };
  const n=(id,def)=>{ const e=document.getElementById(id); if(!e) return def; const v=parseInt(e.value.replace(/[^\d]/g,""),10); return isNaN(v)?def:v; };
  EDIT_CURSOS.forEach((c,i)=>{
    if(gv("cc"+i+"_title")!==undefined) c.title=gv("cc"+i+"_title").trim();
    if(gv("cc"+i+"_tagline")!==undefined) c.tagline=gv("cc"+i+"_tagline").trim();
    c.price=n("cc"+i+"_price",c.price); c.hours=n("cc"+i+"_hours",c.hours); c.classes=n("cc"+i+"_classes",c.classes);
    if(gv("cc"+i+"_modality")!==undefined) c.modality=gv("cc"+i+"_modality").trim();
    if(gv("cc"+i+"_estado")!==undefined) c.estado=gv("cc"+i+"_estado");
    if(gv("cc"+i+"_visible")!==undefined) c.visible = gv("cc"+i+"_visible")!=="no";
    if(gv("cc"+i+"_desde")!==undefined) c.desde=gv("cc"+i+"_desde").trim();
    if(arr("cc"+i+"_learn")!==undefined) c.learn=arr("cc"+i+"_learn");
    if(gv("cc"+i+"_forwho")!==undefined) c.forWho=gv("cc"+i+"_forwho").trim();
    if(arr("cc"+i+"_prereq")!==undefined) c.prerequisites=arr("cc"+i+"_prereq");
    if(arr("cc"+i+"_includes")!==undefined) c.includes=arr("cc"+i+"_includes");
    if(arr("cc"+i+"_syllabus")!==undefined) c.syllabus=arr("cc"+i+"_syllabus");
  });
}
function addCurso(){ syncCursos(); EDIT_CURSOS.push({ id:"curso-"+Date.now().toString(36), title:"Nuevo curso", tagline:"", price:PRICE_STD, modality:"Online grabado", hours:1, classes:1, certificate:true, featured:false, estado:"no", visible:false, desde:"", learn:[], forWho:"", prerequisites:[], includes:[], syllabus:[] }); render(); }
function borrarCurso(i){ syncCursos(); const c=EDIT_CURSOS[i]; if(!confirm("¿Borrar el curso «"+(c.title||"")+"»? Los alumnos que lo tengan asignado dejarán de verlo.")) return; EDIT_CURSOS.splice(i,1); render(); }
function cursosadminHTML(){
  const ea=v=>(""+(v==null?"":v)).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
  const S="border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:14.5px;font-family:var(--sans);color:var(--ink);background:var(--paper);width:100%";
  const inp=(id,lab,v)=>`<label class="field" style="margin-bottom:12px"><span class="lab">${lab}</span><input id="${id}" value="${ea(v)}" style="${S}"></label>`;
  const ta=(id,lab,v,r)=>{ const txt=Array.isArray(v)?v.join("\n"):(v==null?"":v); return `<label class="field" style="margin-bottom:12px"><span class="lab">${lab}</span><textarea id="${id}" rows="${r||3}" style="${S};resize:vertical">${esc(txt)}</textarea></label>`; };
  const est=(sel)=>["disponible","proximo","no"].map(o=>`<option value="${o}"${(sel||"disponible")===o?" selected":""}>${o==="disponible"?"Disponible":o==="proximo"?"Próximamente (con fecha)":"No disponible"}</option>`).join("");
  const rows=EDIT_CURSOS.map((c,i)=>`<details style="border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px"${i===EDIT_CURSOS.length-1&&c.title==="Nuevo curso"?" open":""}>
    <summary style="cursor:pointer;font-weight:700;color:var(--ink)">${esc(c.title||"(sin título)")}${c.visible===false?'<span style="font-size:11px;background:var(--sub);color:#fff;border-radius:6px;padding:2px 7px;margin-left:8px;font-weight:600">Oculto</span>':''}</summary>
    <div style="margin-top:14px">
      ${inp("cc"+i+"_title","Título",c.title)}
      ${inp("cc"+i+"_tagline","Frase corta",c.tagline)}
      <div class="fgrid">${inp("cc"+i+"_price","Precio (número)",c.price)}${inp("cc"+i+"_modality","Modalidad",c.modality)}</div>
      <div class="fgrid">${inp("cc"+i+"_hours","Horas",c.hours)}${inp("cc"+i+"_classes","Clases (informativo)",c.classes)}</div>
      <div class="fgrid">
        <label class="field" style="margin-bottom:12px"><span class="lab">Disponibilidad</span><select id="cc${i}_estado" style="${S}">${est(c.estado)}</select></label>
        ${inp("cc"+i+"_desde","Fecha (si es «Próximamente»)",c.desde||"")}
      </div>
      <label class="field" style="margin-bottom:12px"><span class="lab">Mostrar en la web</span><select id="cc${i}_visible" style="${S}"><option value="si"${c.visible!==false?" selected":""}>Sí — visible para todos</option><option value="no"${c.visible===false?" selected":""}>No — solo lo ves vos (admin)</option></select></label>
      ${ta("cc"+i+"_learn","Qué vas a aprender (uno por línea)",c.learn,5)}
      ${ta("cc"+i+"_forwho","¿Para quién es?",c.forWho,2)}
      ${ta("cc"+i+"_prereq","Requisitos previos (uno por línea)",c.prerequisites,3)}
      ${ta("cc"+i+"_includes","Qué incluye (uno por línea)",c.includes,4)}
      ${ta("cc"+i+"_syllabus","Temario (uno por línea)",c.syllabus,5)}
      <button class="btn btn-quiet" style="color:#B4462F;margin-top:6px" onclick="borrarCurso(${i})"><i data-lucide="trash-2" class="icon"></i> Borrar este curso</button>
    </div>
  </details>`).join("");
  return `<section class="wrap" style="padding:40px 24px 84px;max-width:760px">
    <button class="back" onclick="state.view='admin';loadAlumnos()"><i data-lucide="arrow-left" class="icon"></i> Volver al panel</button>
    <span class="eyebrow">Panel</span>
    <h1 style="font-size:34px;color:var(--ink);margin:12px 0 6px">Gestionar cursos</h1>
    <p class="lead" style="margin:0 0 20px">Agregá cursos nuevos, editalos o borralos. Después cargá sus clases desde «Cargar clases y PDFs» y su examen desde «Editar examen».</p>
    ${rows}
    <button class="btn btn-quiet" onclick="addCurso()" style="margin-bottom:20px"><i data-lucide="plus" class="icon"></i> Agregar curso nuevo</button>
    <div id="cc_err" style="color:#B4462F;font-size:13px;min-height:18px"></div>
    <button id="cc_btn" class="btn btn-honey" onclick="guardarCursos()"><i data-lucide="check" class="icon"></i> Guardar cursos</button>
  </section>`;
}
function guardarCursos(){
  syncCursos();
  const el=document.getElementById("cc_err");
  for(const c of EDIT_CURSOS){ if(!(c.title||"").trim()){ if(el) el.textContent="Hay un curso sin título."; return; } }
  const btn=document.getElementById("cc_btn"); if(btn){ btn.disabled=true; btn.innerHTML="Guardando…"; }
  const out=EDIT_CURSOS.map(c=>Object.assign({}, c));
  db.collection("config").doc("textos").set({courses:out},{merge:true})
    .then(()=>{ courses=out; state.view="admin"; loadAlumnos(); })
    .catch(e=>{ if(btn){ btn.disabled=false; btn.innerHTML='Guardar cursos'; lucide.createIcons(); } if(el) el.textContent="No se pudo guardar. Revisá tu conexión."; console.error(e); });
}

/* ── Editor de examen (preguntas por curso) ── */
let EDIT_QZ = {};
function openExamen(){
  EDIT_QZ={};
  courses.forEach(c=>{ const q=QUIZ[c.id]; EDIT_QZ[c.id]={ aprobar:q&&q.aprobar||0, maxIntentos:q&&q.maxIntentos||3, preguntas:(q&&q.preguntas||[]).map(p=>({ q:p.q, ops:(p.ops||[]).slice(), ok:p.ok })) }; });
  state.examCurso=courses[0]?courses[0].id:null; state.view="examen"; render();
}
function syncQz(){
  const cid=state.examCurso; const Q=EDIT_QZ[cid]; if(!Q) return;
  const ap=document.getElementById("qz_aprobar"); if(ap){ const v=parseInt(ap.value,10); Q.aprobar=isNaN(v)?0:v; }
  Q.preguntas.forEach((p,i)=>{
    const q=document.getElementById("qz"+i+"_q"); if(q) p.q=q.value;
    const ops=document.getElementById("qz"+i+"_ops"); if(ops) p.ops=ops.value.split("\n").map(s=>s.trim()).filter(Boolean);
    const ok=document.getElementById("qz"+i+"_ok"); if(ok){ const v=parseInt(ok.value,10); p.ok=(isNaN(v)?1:v)-1; }
  });
}
function selectExamCurso(id){ syncQz(); state.examCurso=id; render(); }
function addPregunta(){ syncQz(); EDIT_QZ[state.examCurso].preguntas.push({ q:"", ops:["","",""], ok:0 }); render(); }
function removePregunta(i){ syncQz(); if(!confirm("¿Quitar esta pregunta?")) return; EDIT_QZ[state.examCurso].preguntas.splice(i,1); render(); }
function examenHTML(){
  const ea=v=>(""+(v==null?"":v)).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
  const S="border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:14.5px;font-family:var(--sans);color:var(--ink);background:var(--paper);width:100%";
  const cid=state.examCurso; const Q=EDIT_QZ[cid]||{preguntas:[]};
  const opts=courses.map(x=>`<option value="${x.id}"${x.id===cid?" selected":""}>${esc(x.title)}</option>`).join("");
  const rows=Q.preguntas.map((p,i)=>`<div class="card" style="padding:14px 16px;margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><span style="font-weight:700;color:var(--ink)">Pregunta ${i+1}</span><button class="btn btn-quiet" style="padding:6px 9px;color:#B4462F" onclick="removePregunta(${i})"><i data-lucide="trash-2" class="icon"></i></button></div>
    <label class="field" style="margin-bottom:10px"><span class="lab">Pregunta</span><input id="qz${i}_q" value="${ea(p.q)}" style="${S}"></label>
    <label class="field" style="margin-bottom:10px"><span class="lab">Opciones (una por línea, 2 a 4)</span><textarea id="qz${i}_ops" rows="3" style="${S};resize:vertical">${esc((p.ops||[]).join("\n"))}</textarea></label>
    <label class="field"><span class="lab">¿Cuál opción es la correcta? (número de línea: 1, 2, 3…)</span><input id="qz${i}_ok" value="${(p.ok||0)+1}" style="${S};max-width:120px"></label>
  </div>`).join("");
  const total=Q.preguntas.length; const apDef=Q.aprobar||Math.ceil(total*0.6);
  return `<section class="wrap" style="padding:40px 24px 84px;max-width:720px">
    <button class="back" onclick="state.view='admin';loadAlumnos()"><i data-lucide="arrow-left" class="icon"></i> Volver al panel</button>
    <span class="eyebrow">Panel</span>
    <h1 style="font-size:34px;color:var(--ink);margin:12px 0 6px">Editar examen</h1>
    <p class="lead" style="margin:0 0 20px">Cargá las preguntas del examen de cada curso. Si un curso no tiene preguntas, el alumno recibe el certificado al terminar todas las clases (sin examen).</p>
    <label class="field" style="margin-bottom:16px"><span class="lab">Curso</span><select onchange="selectExamCurso(this.value)" style="${S}">${opts}</select></label>
    <label class="field" style="margin-bottom:20px"><span class="lab">Respuestas correctas para aprobar (sobre ${total})</span><input id="qz_aprobar" value="${apDef}" style="${S};max-width:140px"></label>
    ${total?rows:`<div class="card" style="color:var(--sub);margin-bottom:12px">Este curso todavía no tiene preguntas. Agregá la primera o dejalo así (certificado sin examen).</div>`}
    <button class="btn btn-quiet" onclick="addPregunta()" style="margin-bottom:20px"><i data-lucide="plus" class="icon"></i> Agregar pregunta</button>
    <div id="qz_err" style="color:#B4462F;font-size:13px;min-height:18px"></div>
    <button id="qz_btn" class="btn btn-honey" onclick="guardarExamen()"><i data-lucide="check" class="icon"></i> Guardar examen</button>
  </section>`;
}
function guardarExamen(){
  syncQz();
  const out=Object.assign({}, QUIZ); const el=document.getElementById("qz_err");
  Object.keys(EDIT_QZ).forEach(cid=>{
    const Q=EDIT_QZ[cid]; const preguntas=[];
    Q.preguntas.forEach(p=>{
      const q=(p.q||"").trim(); const ops=(p.ops||[]).filter(o=>o&&o.trim());
      if(!q && ops.length===0) return;
      preguntas.push({ q:q, ops:ops, ok:Math.max(0,Math.min(ops.length-1,p.ok||0)) });
    });
    if(preguntas.length){ out[cid]={ aprobar:Math.max(1,Math.min(preguntas.length, Q.aprobar||Math.ceil(preguntas.length*0.6))), maxIntentos:Q.maxIntentos||3, preguntas:preguntas }; }
    else { delete out[cid]; }
  });
  // validación mínima del curso actual
  const cur=EDIT_QZ[state.examCurso];
  for(const p of (cur?cur.preguntas:[])){ const q=(p.q||"").trim(); const ops=(p.ops||[]).filter(o=>o&&o.trim()); if(q && ops.length<2){ if(el) el.textContent="La pregunta «"+q+"» necesita al menos 2 opciones."; return; } }
  const btn=document.getElementById("qz_btn"); if(btn){ btn.disabled=true; btn.innerHTML="Guardando…"; }
  db.collection("config").doc("textos").set({quizzes:out},{merge:true})
    .then(()=>{ QUIZ=out; state.view="admin"; loadAlumnos(); })
    .catch(e=>{ if(btn){ btn.disabled=false; btn.innerHTML='Guardar examen'; lucide.createIcons(); } if(el) el.textContent="No se pudo guardar. Revisá tu conexión."; console.error(e); });
}

/* ═══════════════ RENDER ═══════════════ */
function render(){
  const app=document.getElementById("app");
  let v=state.view; const c=courseById(state.courseId);
  if(v==="admin" && !(sesion&&sesion.role==="admin")) v=state.view="login";
  if(v==="contenido" && !(sesion&&sesion.role==="admin")) v=state.view="login";
  if(v==="clases" && !(sesion&&sesion.role==="admin")) v=state.view="login";
  if((v==="cursosadmin"||v==="examen") && !(sesion&&sesion.role==="admin")) v=state.view="login";
  if((v==="aula"||v==="leccion"||v==="evaluacion"||v==="onboarding"||v==="certificado") && !sesion) v=state.view="login";
  if(v==="aula" && sesion && sesion.role==="alumno" && !sesion.preview && !perfilActual) v=state.view="onboarding";
  if(v==="leccion" && !curLec) v=state.view="aula";
  if(v==="evaluacion" && !evalState) v=state.view="aula";
  if(v==="certificado" && !state.certCid) v=state.view="aula";

  if(v==="home") app.innerHTML=homeHTML();
  else if(v==="course") app.innerHTML=detailHTML(c);
  else if(v==="inscription") app.innerHTML=inscriptionHTML(c);
  else if(v==="empresas") app.innerHTML=empresasHTML();
  else if(v==="eventos") app.innerHTML=eventosHTML();
  else if(v==="nosotros") app.innerHTML=nosotrosHTML();
  else if(v==="recursos") app.innerHTML=recursosHTML();
  else if(v==="login") app.innerHTML=loginHTML();
  else if(v==="onboarding") app.innerHTML=onboardingHTML();
  else if(v==="admin") app.innerHTML=adminHTML();
  else if(v==="contenido") app.innerHTML=contenidoHTML();
  else if(v==="clases") app.innerHTML=clasesHTML();
  else if(v==="cursosadmin") app.innerHTML=cursosadminHTML();
  else if(v==="examen") app.innerHTML=examenHTML();
  else if(v==="aula") app.innerHTML=aulaHTML();
  else if(v==="leccion") app.innerHTML=leccionHTML();
  else if(v==="evaluacion") app.innerHTML=evalHTML();
  else if(v==="certificado") app.innerHTML=certificadoHTML();

  const navView=(v==="course"||v==="inscription")?"home":v;
  let navHTML=NAV.map(([k,l])=>`<button class="navlink${navView===k?' active':''}" onclick="go('${k}')">${l}</button>`).join("");
  if(sesion && sesion.role==="admin"){ navHTML += `<button class="navlink${v==="admin"?' active':''}" onclick="state.view='admin';loadAlumnos()">Panel</button><button class="navlink" onclick="logout()">Salir</button>`; }
  else if(sesion && sesion.preview){ navHTML += `<button class="navlink" onclick="exitPreview()">Volver al panel</button>`; }
  else if(sesion){ navHTML += `<button class="navlink${["aula","leccion","evaluacion","onboarding"].includes(v)?' active':''}" onclick="go('aula')">Mi aula</button><button class="navlink" onclick="logout()">Salir</button>`; }
  else { navHTML += `<button class="navlink${v==="login"?' active':''}" onclick="go('login')">Acceso alumnos</button>`; }
  document.getElementById("nav").innerHTML=navHTML;
  document.body.className="";
  document.getElementById("foot-copy").textContent="© "+new Date().getFullYear()+" Tu Profe IA · "+(CONTENIDO.footer_texto||"");
  lucide.createIcons();
  window.scrollTo({top:0});
  if(v==="leccion") initYT();
}

/* ═══════════════ SESIÓN (Firebase Auth) ═══════════════ */
auth.onAuthStateChanged(async (user)=>{
  if(!user){
    sesion=null; perfilActual=null; progreso={};
    if(["admin","aula","leccion","evaluacion","onboarding","certificado"].includes(state.view)) state.view="home";
    render(); return;
  }
  const email=(user.email||"").toLowerCase();
  if(email===ADMIN_EMAIL.toLowerCase()){
    sesion={ role:"admin", uid:user.uid, email, nombre:"Administración" }; perfilActual=null; progreso={};
    if(state.view==="login"){ state.view="admin"; loadAlumnos(); return; }
    render(); return;
  }
  let cursos=[], nombre=email;
  try{ const s=await db.collection("alumnos").doc(email).get(); if(s.exists){ const d=s.data(); cursos=d.cursos||[]; nombre=d.nombre||nombre; } }catch(e){ console.error(e); }
  try{ const ps=await db.collection("perfiles").doc(user.uid).get(); perfilActual=ps.exists?ps.data():null; }catch(e){ perfilActual=null; }
  try{ const gp=await db.collection("progreso").doc(user.uid).get(); progreso=gp.exists?(gp.data()||{}):{}; }catch(e){ progreso={}; }
  sesion={ role:"alumno", uid:user.uid, email, nombre:(perfilActual&&perfilActual.nombre)||nombre, cursos };
  if(state.view==="login") state.view="aula";
  render();
});
render();
cargarContenido();
</script>
